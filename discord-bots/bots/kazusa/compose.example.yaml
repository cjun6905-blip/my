{
  "services": {
    "bot": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.snapshot",
        "args": {
          "BASE_IMAGE": "character-guidance-whitealbum:20261029t105923z"
        }
      },
      "image": "persona-kazusa:source-snapshot",
      "restart": "unless-stopped",
      "init": true,
      "env_file": [
        ".env"
      ],
      "environment": {
        "TZ": "Asia/Shanghai",
        "FLEET_VISION_CONCURRENCY": "2",
        "IMAGEGEN_ENV_FILE": "/run/secrets/imagegen.env",
        "BOT_ENV_FILE": "/run/secrets/runtime.env",
        "BOT_PROFILE": "kazusa",
        "FLEET_BUDGET_DB": "/app/fleet/budget.db",
        "FLEET_MODEL_CONCURRENCY": "2",
        "GUILD_IDS": "${GUILD_IDS:-}"
      },
      "volumes": [
        "./.runtime/config:/app/config:ro",
        "./.runtime/data:/app/data",
        "../../.runtime/fleet:/app/fleet",
        "./.env:/run/secrets/runtime.env:ro",
        "./.imagegen.env:/run/secrets/imagegen.env:ro",
        "./.imagegen-openai.env:/run/secrets/openai-image.env:ro",
        "./.speech.env:/run/secrets/speech.env:ro"
      ],
      "command": [
        "python",
        "-m",
        "src.main"
      ],
      "mem_limit": 268435456,
      "pids_limit": 64,
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  }
}
